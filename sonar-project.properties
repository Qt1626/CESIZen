# Configuration SonarCloud (SonarQube Cloud) pour CESIZen.
# Organisation et projet crees sur https://sonarcloud.io (organisation "qt1626").
# L'analyse en CI necessite le secret GitHub SONAR_TOKEN (Settings > Secrets and
# variables > Actions > New repository secret) ; voir .github/workflows/ci.yml,
# etape "Analyse SonarCloud".

sonar.organization=qt1626
sonar.projectKey=Qt1626_CESIZen
sonar.projectName=CESIZen

sonar.sources=src
sonar.tests=tests
sonar.php.coverage.reportPaths=var/coverage/coverage.xml

sonar.exclusions=vendor/**,var/**,node_modules/**,public/build/**,public/bundles/**

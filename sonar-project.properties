# Configuration SonarCloud pour CESIZen.
# A completer avec votre organisation/projet SonarCloud (https://sonarcloud.io),
# puis ajouter le secret GitHub SONAR_TOKEN (Settings > Secrets and variables >
# Actions > New repository secret) pour activer automatiquement l'analyse en CI
# (voir .github/workflows/ci.yml, etape "Analyse SonarCloud").

sonar.organization=votre-organisation-sonarcloud
sonar.projectKey=votre-organisation-sonarcloud_cesizen
sonar.projectName=CESIZen

sonar.sources=src
sonar.tests=tests
sonar.php.coverage.reportPaths=var/coverage/coverage.xml

sonar.exclusions=vendor/**,var/**,node_modules/**,public/build/**,public/bundles/**

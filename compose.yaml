services:

  # =========================================================
  # DEV
  # =========================================================
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: cesizen-dev
    ports:
      - "8001:10000"
    env_file:
      - .env.dev.local
    command: >
      sh -c "php bin/console doctrine:schema:update --force --env=$$APP_ENV
      && php -S 0.0.0.0:10000 -t public"
    depends_on:
      db-dev:
        condition: service_healthy
    networks:
      - dev_net

  db-dev:
    image: postgres:16-alpine
    container_name: cesizen-db-dev
    env_file:
      - .env.dev.local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - dev_database_data:/var/lib/postgresql/data
    networks:
      - dev_net


  # =========================================================
  # QA
  # =========================================================
  app-qa:
    build:
      context: .
      dockerfile: Dockerfile
      target: qa
    container_name: cesizen-qa
    ports:
      - "8002:10000"
    env_file:
      - .env.qa.local
    command: >
      sh -c "php bin/console doctrine:schema:update --force --env=$$APP_ENV
      && php -S 0.0.0.0:10000 -t public"
    depends_on:
      db-qa:
        condition: service_healthy
    networks:
      - qa_net

  db-qa:
    image: postgres:16-alpine
    container_name: cesizen-db-qa
    env_file:
      - .env.qa.local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - qa_database_data:/var/lib/postgresql/data
    networks:
      - qa_net


  # =========================================================
  # PREPROD
  # =========================================================
  app-preprod:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    image: cesizen:${CESIZEN_IMAGE_TAG:-local}
    container_name: cesizen-preprod
    ports:
      - "8003:10000"
    env_file:
      - .env.preprod.local
    command: >
      sh -c "php bin/console doctrine:schema:update --force --env=$$APP_ENV
      && php -S 0.0.0.0:10000 -t public"
    depends_on:
      db-preprod:
        condition: service_healthy
    networks:
      - preprod_net

  db-preprod:
    image: postgres:16-alpine
    container_name: cesizen-db-preprod
    env_file:
      - .env.preprod.local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - preprod_database_data:/var/lib/postgresql/data
    networks:
      - preprod_net


  # =========================================================
  # PROD
  # =========================================================
  app-prod:
    image: cesizen:${CESIZEN_IMAGE_TAG:-local}
    container_name: cesizen-prod
    ports:
      - "8004:10000"
    env_file:
      - .env.prod.local
    command: >
      sh -c "php bin/console doctrine:schema:update --force --env=$$APP_ENV
      && php -S 0.0.0.0:10000 -t public"
    depends_on:
      db-prod:
        condition: service_healthy
    networks:
      - prod_net

  db-prod:
    image: postgres:16-alpine
    container_name: cesizen-db-prod
    env_file:
      - .env.prod.local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - prod_database_data:/var/lib/postgresql/data
    networks:
      - prod_net


# =========================================================
# VOLUMES
# =========================================================
volumes:
  dev_database_data:
  qa_database_data:
  preprod_database_data:
  prod_database_data:


# =========================================================
# NETWORKS
# =========================================================
networks:
  dev_net:
  qa_net:
  preprod_net:
  prod_net: